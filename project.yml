name: Autopause
options:
  bundleIdPrefix: app.reily
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  SWIFT_VERSION: "5.0"
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  SWIFT_STRICT_CONCURRENCY: minimal
  SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
  SWIFT_APPROACHABLE_CONCURRENCY: NO
  CODE_SIGN_STYLE: Automatic
  CURRENT_PROJECT_VERSION: "2"
  MARKETING_VERSION: "1.0.1"
targets:
  Autopause:
    type: application
    platform: macOS
    sources:
      - path: Autopause
        excludes:
          - Info.plist
          - Autopause.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.reily.autopause
        PRODUCT_NAME: Autopause
        INFOPLIST_FILE: Autopause/Info.plist
        CODE_SIGN_ENTITLEMENTS: Autopause/Autopause.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
  AutopauseTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AutopauseTests
      - path: Autopause/State/DuckStateMachine.swift
      - path: Autopause/Mic/MicTypes.swift
      - path: Autopause/Mic/MonitorPolicy.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.reily.autopause.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""
schemes:
  Autopause:
    build:
      targets:
        Autopause: all
        AutopauseTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: AutopauseTests
